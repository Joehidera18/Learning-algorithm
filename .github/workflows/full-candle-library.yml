name: Full 15-coin candle library
on:
  pull_request:
    branches: [main]
    types: [opened]
    paths:
      - scripts/build_coin_candle_library.py
      - .github/workflows/full-candle-library.yml
permissions:
  contents: read
jobs:
  download:
    if: github.head_ref == 'improve/intraday-candle-library' && github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        coin: [BTC, ETH, SOL, HBAR, XRP, XLM, ADA, DOGE, AVAX, LINK, LTC, BCH, DOT, UNI, AAVE]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify data conversion and complete aggregation
        run: |
          python3 -m unittest discover -s tests -p test_hbar_alternatives.py -v
          python3 -m unittest discover -s tests -p test_candle_library.py -v
      - name: Download listing-to-cutoff spot history
        run: python3 scripts/build_coin_candle_library.py --coin ${{ matrix.coin }} --end-ms 1789930200000 --out datasets/${{ matrix.coin }}
      - name: Save the coin's seven timeframes and provenance
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ matrix.coin }}-market-candles
          path: datasets/${{ matrix.coin }}/
          if-no-files-found: warn
          retention-days: 90
