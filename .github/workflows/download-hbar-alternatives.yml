name: Download alternative HBAR spot data
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/download_hbar_alternatives.py
      - tests/test_hbar_alternatives.py
      - .github/workflows/download-hbar-alternatives.yml
permissions:
  contents: read
concurrency:
  group: hbar-alternative-data-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  download:
    if: github.head_ref == 'research/hbar-alternative-data' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate timestamp units, field mappings and archive range reads
        run: python3 -m unittest discover -s tests -p test_hbar_alternatives.py -v
      - name: Retrieve public KuCoin and Kraken spot history
        run: python3 scripts/download_hbar_alternatives.py --sources kucoin kraken --out hbar-alternative-output
      - name: Preserve source observations and coverage reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: HBAR-alternative-spot-data
          path: hbar-alternative-output/
          if-no-files-found: error
          retention-days: 30
